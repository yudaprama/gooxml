name: Build & Release CLI

# Fires after the auto-tag workflow tags every push to main/master.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ooxcli
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          bin="ooxcli-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            bin="${bin}.exe"
          fi
          go build -trimpath -ldflags="-s -w" \
            -o "dist/${bin}" ./cmd/ooxcli

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ooxcli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.exe
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          assets=($(find dist -type f -name "ooxcli-*" | sort))
          echo "Tag: ${tag}"
          echo "Assets:"
          printf '  %s\n' "${assets[@]}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} exists; uploading assets."
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            echo "Creating release ${tag}."
            gh release create "${tag}" "${assets[@]}" \
              --title "ooxcli ${tag}" \
              --notes "Automated build of the ooxcli CLI for tag ${tag}."
          fi
